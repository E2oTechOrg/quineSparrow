<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Video Demo</title>
  <style>
    /* Container fills viewport */
    .hero-video-container {
      position: relative;
      width: 100%;
      height: 100vh; /* Full viewport height */
      overflow: hidden;
    }

    /* Video fills container */
    .hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cover container without distortion */
      display: block;
    }

    /* Overlay for text or dark filter */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.3); /* optional semi-transparent overlay */
      pointer-events: none;
    }

    .hero-overlay h1 {
      font-size: 3rem;
      margin: 0;
    }

    .hero-overlay p {
      font-size: 1.5rem;
      margin-top: 10px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .hero-overlay h1 {
        font-size: 2rem;
      }
      .hero-overlay p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Hero Video Section -->
  <section class="hero-video-container">
    <video 
      class="hero-video" 
      autoplay 
      loop 
      muted 
      playsinline 
      preload="metadata">
      <source src="videos/hero-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- Optional overlay -->
    <div class="hero-overlay">
      <h1>Welcome to Our Event</h1>
      <p>Creating memories that last a lifetime</p>
    </div>
  </section>

</body>
</html>
